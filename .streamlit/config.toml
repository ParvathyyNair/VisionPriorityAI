[server]
enableStaticServing = true    # serves ./static (scene videos) from this computer
headless = true
runOnSave = false
fileWatcherType = "none"      # offline / in-vehicle: no file-watcher overhead

[theme]
base = "dark"
primaryColor = "#1aa6bd"
font = "sans serif"

[browser]
gatherUsageStats = false      # no usage telemetry calls

[global]
developmentMode = false
